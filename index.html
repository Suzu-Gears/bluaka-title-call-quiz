<!doctype html>
<html lang="ja" prefix="og: https://ogp.me/ns#">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>ブルアカタイトルコールクイズ</title>
    <meta
      name="description"
      content="ブルアカのタイトルコールを聴いて、生徒を当てるクイズゲームです。"
    />
    <meta name="robots" content="noimageindex" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta property="og:site_name" content="ブルアカタイトルコールクイズ" />
    <meta property="og:title" content="ブルアカタイトルコールクイズ" />
    <meta
      property="og:description"
      content="ブルアカのタイトルコールを聴いて、生徒を当てるクイズゲームです。"
    />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta name="twitter:title" content="ブルアカタイトルコールクイズ" />
    <meta
      name="twitter:description"
      content="ブルアカのタイトルコールを聴いて、生徒を当てるクイズゲームです。"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="%BASE_URL%icon-mask.png" />
  </head>
  <body>
    <div class="main">
      <header>
        <h1>ブルアカ タイトルコールクイズ</h1>
      </header>
      <div class="content">
        <p id="app-error" class="app-error" role="alert" hidden></p>
        <div class="page-switch">
          <button type="button" data-view-target="card-list" class="is-active">
            生徒リスト
          </button>
          <button type="button" data-view-target="quiz-view">クイズ</button>
        </div>
        <section id="card-list">
          <div class="list-head-sentinel" aria-hidden="true"></div>
          <div class="list-head">
            <div class="panel-head">
              <svg
                class="panel-head-icon"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <rect
                  x="4"
                  y="2.5"
                  width="16"
                  height="19"
                  rx="2.5"
                  fill="#2f86d6"
                />
                <rect
                  x="6.5"
                  y="5"
                  width="11"
                  height="6.5"
                  rx="1"
                  fill="#ffffff"
                  opacity="0.92"
                />
                <rect
                  x="6.5"
                  y="13.5"
                  width="11"
                  height="1.8"
                  rx="0.9"
                  fill="#ffffff"
                  opacity="0.85"
                />
                <rect
                  x="6.5"
                  y="17"
                  width="8"
                  height="1.8"
                  rx="0.9"
                  fill="#ffffff"
                  opacity="0.85"
                />
              </svg>
              <h2 class="panel-head-title">生徒リスト</h2>
            </div>
            <div class="controls-row">
              <div class="sort-controls">
                <button
                  id="student-search-toggle"
                  class="toolbar-skew-button search-toggle-button"
                  type="button"
                  aria-expanded="false"
                  aria-controls="student-search-bar"
                  aria-label="生徒名で検索"
                  title="生徒名で検索"
                >
                  <svg
                    class="search-toggle-icon"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <g
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.6"
                      stroke-linecap="round"
                    >
                      <circle cx="10" cy="10" r="6" />
                      <path d="M14.5 14.5l5.5 5.5" />
                    </g>
                  </svg>
                </button>
                <button
                  id="student-filter-open"
                  class="toolbar-skew-button filter-open-button"
                  type="button"
                  aria-haspopup="dialog"
                  aria-label="フィルター"
                  title="フィルター"
                >
                  <svg
                    class="filter-open-icon"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path
                      d="M3.5 3.2h17l-6.5 7.8v9.9l-4-2.4v-7.5z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2.2"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <label class="visually-hidden" for="student-sort-select"
                  >並べ替え</label
                >
                <select id="student-sort-select">
                  <option value="default-order">実装順</option>
                  <option value="name-order">名前順</option>
                </select>
                <button
                  id="student-sort-direction"
                  class="sort-direction-button toolbar-skew-button"
                  type="button"
                  data-direction="desc"
                  aria-label="降順"
                  title="降順"
                >
                  <svg
                    class="sort-direction-icon"
                    width="33"
                    height="24"
                    viewBox="0 0 33 24"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <!-- 端面は角(丸くしない)。矢印は塗りにして、斜めストロークの
                         アンチエイリアスで横棒より薄く見えるのを防ぐ。
                         横棒と矢印の間は矢印半分ほど空ける -->
                    <g fill="none" stroke="currentColor" stroke-width="2.4">
                      <path d="M1.5 6h18.6" />
                      <path d="M1.5 12h18.6" />
                      <path d="M1.5 18h18.6" />
                    </g>
                    <g class="sort-direction-arrow" fill="currentColor">
                      <path d="M26.5 4.8h2.4v10h-2.4z" />
                      <path d="M23.9 14.8h7.6l-3.8 4.6z" />
                    </g>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="grid-frame">
            <div class="grid-scroll">
              <div id="student-search-bar" class="student-search-bar" hidden>
                <label class="search-wrapper" for="student-filter-input">
                  <span class="visually-hidden">名前フィルター</span>
                  <input
                    id="student-filter-input"
                    class="student-filter-input"
                    type="text"
                    placeholder="生徒の名前を入力してください"
                    autocomplete="off"
                  />
                </label>
              </div>
              <div class="grid" id="studentGrid"></div>
            </div>
          </div>
        </section>
        <section id="quiz-view" hidden>
          <div class="panel-head">
            <svg
              class="panel-head-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <rect
                x="2.5"
                y="2.5"
                width="19"
                height="15"
                rx="3.5"
                fill="#2f86d6"
              />
              <path d="M8 20.8l1.6-3.6h4.2L10.3 21z" fill="#2f86d6" />
              <text
                x="12"
                y="14.6"
                text-anchor="middle"
                font-size="11.5"
                font-weight="700"
                fill="#ffffff"
                font-family="'Kosugi Maru', sans-serif"
              >
                ?
              </text>
            </svg>
            <h2 class="panel-head-title">クイズ</h2>
            <div class="quiz-menu">
              <button
                id="quiz-menu-button"
                type="button"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="quiz-menu-panel"
              >
                メニュー
              </button>
              <div
                id="quiz-menu-panel"
                class="quiz-menu-panel"
                role="menu"
                hidden
              >
                <button
                  id="quiz-menu-restart-button"
                  type="button"
                  role="menuitem"
                  disabled
                >
                  リスタート
                </button>
                <button
                  id="quiz-menu-reset-screen-button"
                  type="button"
                  role="menuitem"
                >
                  クイズ設定画面に戻る
                </button>
                <button
                  id="quiz-export-progress-button"
                  type="button"
                  role="menuitem"
                >
                  進捗をエクスポート
                </button>
                <button
                  id="quiz-import-progress-button"
                  type="button"
                  role="menuitem"
                >
                  進捗をインポート
                </button>
                <button
                  id="quiz-sync-button"
                  type="button"
                  role="menuitem"
                  hidden
                >
                  クラウド同期
                </button>
              </div>
            </div>
          </div>
          <section aria-label="クイズ" class="quiz-section">
            <div id="quiz-setup-controls">
              <div class="quiz-setup-grid">
                <div class="quiz-setup-main">
                  <div class="quiz-mode-wrapper">
                    <div class="quiz-banner">出題方式</div>
                    <div
                      id="quiz-mode-group"
                      class="radio-group quiz-mode-component-wrapper"
                    >
                      <label class="para" ontouchstart="">
                        <input
                          type="radio"
                          name="quiz-mode"
                          value="multiple-choice"
                          class="radio-input"
                          checked
                        />
                        <span class="radio-label">4択</span>
                      </label>
                      <label class="para" ontouchstart="">
                        <input
                          type="radio"
                          name="quiz-mode"
                          value="name-input"
                          class="radio-input"
                        />
                        <span class="radio-label">名前入力</span>
                      </label>
                      <label class="para" ontouchstart="">
                        <input
                          type="radio"
                          name="quiz-mode"
                          value="name-input-lunatic"
                          class="radio-input"
                        />
                        <span class="radio-label">名前入力 ( Lunatic )</span>
                      </label>
                    </div>
                  </div>
                  <fieldset class="quiz-filter-fieldset pill-filter-fieldset">
                    <legend class="visually-hidden">出題対象</legend>
                    <div class="quiz-banner" aria-hidden="true">出題対象</div>
                    <div class="pill-row">
                      <label
                        ><input
                          id="quiz-filter-normal"
                          type="checkbox"
                          checked
                        />通常生徒</label
                      >
                      <label
                        ><input
                          id="quiz-filter-costume"
                          type="checkbox"
                        />別衣装</label
                      >
                      <label
                        ><input
                          id="quiz-filter-collaboration"
                          type="checkbox"
                        />コラボ</label
                      >
                    </div>
                  </fieldset>
                </div>
                <aside class="quiz-setup-action">
                  <div class="quiz-count-panel">
                    <label
                      class="quiz-question-count-wrapper"
                      for="quiz-question-count-input"
                    >
                      <span class="quiz-banner">問題数</span>
                      <div
                        class="quiz-question-count-input-controls button-group quiz-question-count-component-wrapper"
                      >
                        <button
                          id="quiz-question-count-min-button"
                          class="para"
                          type="button"
                        >
                          <span class="btn min">MIN</span>
                        </button>
                        <button
                          id="quiz-question-count-minus-button"
                          class="para"
                          type="button"
                          aria-label="問題数を1減らす"
                        >
                          <span class="btn minus">－</span>
                        </button>
                        <div class="para">
                          <input
                            id="quiz-question-count-input"
                            class="counter"
                            type="number"
                            min="1"
                            max="10"
                            step="1"
                            value="10"
                            inputmode="numeric"
                          />
                        </div>
                        <button
                          id="quiz-question-count-plus-button"
                          class="para"
                          type="button"
                          aria-label="問題数を1増やす"
                        >
                          <span class="btn plus">＋</span>
                        </button>
                        <button
                          id="quiz-question-count-max-button"
                          class="para"
                          type="button"
                        >
                          <span class="btn max">MAX</span>
                        </button>
                      </div>
                    </label>
                  </div>
                  <button
                    id="quiz-start-button"
                    class="quiz-action-button quiz-start-cta"
                    type="button"
                  >
                    開始
                  </button>
                </aside>
              </div>
            </div>
            <p id="quiz-status" role="status"></p>
            <div class="quiz-controls">
              <button
                id="quiz-next-button"
                class="quiz-action-button"
                type="button"
                disabled
              >
                次へ
              </button>
              <button
                id="quiz-play-audio-button"
                class="quiz-action-button"
                type="button"
                disabled
              >
                もう一度再生
              </button>
            </div>
            <div id="quiz-result-actions" class="quiz-controls" hidden>
              <button
                id="quiz-result-restart-button"
                class="quiz-action-button"
                type="button"
              >
                リスタート
              </button>
              <button
                id="quiz-result-back-button"
                class="quiz-action-button"
                type="button"
              >
                クイズ設定画面に戻る
              </button>
            </div>
            <div class="quiz-choices" id="quiz-choices"></div>
            <form
              id="quiz-name-answer-form"
              class="quiz-name-answer-form"
              hidden
            >
              <input
                id="quiz-name-answer-input"
                type="text"
                autocomplete="off"
                placeholder="生徒名を入力"
              />
              <button type="submit">回答する</button>
            </form>
            <div
              id="quiz-name-answer-suggestions-overlay"
              class="quiz-name-answer-suggestions-overlay"
              hidden
            >
              <div
                id="quiz-name-answer-suggestions"
                class="quiz-name-answer-suggestions"
                hidden
              ></div>
            </div>
            <div id="quiz-answer-feedback" class="quiz-answer-feedback" hidden>
              <img id="quiz-answer-image" alt="" />
              <p id="quiz-answer-name"></p>
              <small
                id="quiz-answer-clip-label"
                class="quiz-answer-clip-label"
              ></small>
            </div>
            <section id="quiz-result" class="quiz-result" hidden>
              <h3>リザルト</h3>
              <p id="quiz-result-summary"></p>
              <div id="quiz-result-perfect-row" hidden>
                <img
                  id="quiz-result-perfect-stamp"
                  src="%BASE_URL%kokona-stamp.png"
                  alt="100点満点スタンプ"
                  hidden
                />
                <p id="quiz-result-perfect-message" hidden>
                  100点満点、花丸です！
                </p>
              </div>
              <div id="quiz-result-list" class="quiz-result-list"></div>
            </section>
            <small id="quiz-costume-hint-text"></small>
            <small id="quiz-proficiency-text"></small>
          </section>
        </section>
      </div>
      <footer>
        <div>
          <small id="footer-version"></small>
          <a
            href="https://github.com/Suzu-Gears/bluaka-title-call-quiz/"
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </div>
        <small>
          当WEBサイトはNexon、Nexon GamesおよびYostarとは一切関係ありません。<br />
          当WEBサイトでは、データベースとして
          <a
            href="https://schaledb.com/"
            target="_blank"
            rel="noopener noreferrer"
            >Schale DB</a
          >
          を参照しています。ゲーム画像・情報の所有権および著作権はそれぞれの権利者に帰属します。
        </small>
      </footer>
    </div>
    <dialog id="filter-dialog" class="app-dialog filter-dialog">
      <div class="filter-dialog-head">
        <h3 class="filter-dialog-title">フィルター</h3>
        <button
          id="filter-dialog-close"
          class="filter-dialog-close"
          type="button"
          aria-label="閉じる"
        >
          ×
        </button>
      </div>
      <div class="filter-dialog-body">
        <div class="filter-section-label">表示対象</div>
        <fieldset class="category-filter-fieldset pill-filter-fieldset">
          <legend class="visually-hidden">表示対象</legend>
          <label
            ><input
              id="student-filter-normal"
              type="checkbox"
              checked
            />通常生徒</label
          >
          <label
            ><input
              id="student-filter-costume"
              type="checkbox"
              checked
            />別衣装</label
          >
          <label
            ><input
              id="student-filter-collaboration"
              type="checkbox"
              checked
            />コラボ</label
          >
        </fieldset>
      </div>
      <div class="filter-dialog-actions">
        <button
          id="filter-cancel-button"
          class="filter-action-button filter-cancel-button"
          type="button"
        >
          キャンセル
        </button>
        <button
          id="filter-confirm-button"
          class="filter-action-button filter-confirm-button"
          type="button"
        >
          確認
        </button>
      </div>
    </dialog>
    <dialog id="progress-dialog" class="app-dialog">
      <h3 id="progress-dialog-title">進捗データ</h3>
      <p id="progress-dialog-description" class="app-dialog-description"></p>
      <textarea
        id="progress-dialog-textarea"
        class="app-dialog-textarea"
        rows="8"
        spellcheck="false"
        autocomplete="off"
      ></textarea>
      <p
        id="progress-dialog-status"
        class="app-dialog-status"
        role="status"
      ></p>
      <div class="app-dialog-actions">
        <input
          id="progress-dialog-file"
          type="file"
          accept="application/json,.json"
          hidden
        />
        <button id="progress-dialog-file-button" type="button">
          ファイルを選択
        </button>
        <button id="progress-dialog-copy-button" type="button">コピー</button>
        <button id="progress-dialog-download-button" type="button">
          ダウンロード
        </button>
        <button id="progress-dialog-apply-button" type="button">
          読み込む
        </button>
        <button id="progress-dialog-close-button" type="button">閉じる</button>
      </div>
    </dialog>
    <dialog id="sync-dialog" class="app-dialog">
      <h3>クラウド同期</h3>
      <p class="app-dialog-description">
        同期コードはパスワードと同じ扱いです。他人に教えないでください。<br />
        別の端末で同じコードを入力すると、同じ進捗を読み書きできます。
      </p>
      <label class="app-dialog-field" for="sync-code-input">
        同期コード
        <input
          id="sync-code-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="未設定"
        />
      </label>
      <p id="sync-dialog-status" class="app-dialog-status" role="status"></p>
      <div class="app-dialog-actions">
        <button id="sync-generate-button" type="button">
          新しいコードを発行
        </button>
        <button id="sync-upload-button" type="button">クラウドへ保存</button>
        <button id="sync-download-button" type="button">
          クラウドから読込
        </button>
        <button id="sync-close-button" type="button">閉じる</button>
      </div>
    </dialog>
    <script type="module" src="%BASE_URL%src/main.ts"></script>
  </body>
</html>
